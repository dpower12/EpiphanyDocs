name: Publish docs via GitHub Pages
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v2

      - name: Deploy docs
        uses: catinsurance/properdocs-deploy-gh-pages@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CUSTOM_DOMAIN: dpower12.github.io
          CONFIG_FILE: properdocs.yml
          EXTRA_PACKAGES: build-base
          # GITHUB_DOMAIN: github.myenterprise.com
          REQUIREMENTS: requirements.txt
repo_url: https://github.com/dpower12/EpiphanyDocs
repo_name: dpower12/EpiphanyDocs
edit_uri: edit/main/docs/
site_url: ""
use_directory_urls: False