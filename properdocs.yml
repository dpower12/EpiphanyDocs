site_name: Epiphany API Docs
nav:
  - Home: index.md
  - Docs:
    - Mod Global: globals.md
    - Enums:
      - "BagGFXPriority": enums/Epiphany.API.BagGFXPriority.md
      - "BagSynergyFlags": enums/Epiphany.API.BagSynergyFlags.md
      - "CardGroup": enums/Epiphany.API.CardGroup.md
      - "HeartGroup": enums/Epiphany.API.HeartGroup.md
      - "SlotGroup": enums/Epiphany.API.SlotGroup.md
      - "CrimsonWispMaturity": enums/Epiphany.CrimsonWispMaturity.md
      - "CrimsonWispType": enums/Epiphany.CrimsonWispType.md
      - "ExtraCallbacks": enums/Epiphany.ExtraCallbacks.md
      - "RoomClearType": enums/Epiphany.RoomClearType.md
    - "BagData": classes/BagData.md
    - "BagMetaData": classes/BagMetaData.md
    - "BagsInfo": classes/BagsInfo.md
    - "BagSwingParams": classes/BagSwingParams.md
    - "BurstParamsConfig": classes/BurstParamsConfig.md
    - "ImpactBurstParams": classes/ImpactBurstParams.md
    - "PlayerBagData": classes/PlayerBagData.md
    - "PlayerSwingParams": classes/PlayerSwingParams.md
    - "SwingingBagData": classes/SwingingBagData.md
    - "ThrownBagData": classes/ThrownBagData.md
  - Guides:
    - "Adding a Character": guides/adding_a_character.md
    - "Golden beggars": guides/golden_beggars.md
    - "Golden items": guides/golden_items.md
    - "Item pools": guides/item_pools.md
    - "Item tags": guides/item_tags.md
    - "Menu music": guides/menu_music.md
    - "Minor compatibility": guides/minor_compatibility.md
    - "Object groups": guides/object_groups.md
    - "Remembrance familiars": guides/remembrance_familiars.md
    - "Sample bombs": guides/sample_bombs.md
    - "Throwing Bag": guides/throwing_bag_synergies.md
    - "True Love": guides/true_love.md
    - "Turnover shops": guides/turnover_shops.md
theme:
  name: material
  favicon: img/epiphany_favicon.ico
  icon:
    repo: fontawesome/brands/github
  logo: img/epiphany_favicon.ico
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
  - content.code.copy
  - search.suggest
  - search.highlight
  - search.share
  - navigation.tabs
  - navigation.instant
  - navigation.top
extra_css:
- css/custom.css
extra_javascript:
- https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js
- https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
- js/tablesort.number.min.js
- js/customJS.js
- js/jquery.mark.min.js
markdown_extensions:
  - toc:
      permalink: ⚓︎
      toc_depth: 3
  - pymdownx.highlight:
      linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
      url_download: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
plugins:
  - include-markdown
  - search:
      separator: '[\s\-\.\_\·]+'
  - git-revision-date-localized:
      fallback_to_build_date: true
      type: date
  - git-authors:
      show_email_address: false
      sort_authors_by: contribution
  - tags:
      enabled: false
      tags: false
